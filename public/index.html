<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Chat para Superheroes</title>

    <link href='https://fonts.googleapis.com/css?family=Quicksand:300,400' rel='stylesheet' type='text/css'>
	<link href='https://fonts.googleapis.com/css?family=Lato:400,300' rel='stylesheet' type='text/css'>
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="js/libs/plugins/mdtoast.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.0/animate.css">

    <link rel="shortcut icon" type="image/ico" href="img/favicon.ico"/>

    <link rel="manifest" href="manifest.json">

    <!-- Android -->
    <meta name="theme-color" content="#3498db">

    <!-- IOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="apple-touch-icon" href="img/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="img/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="img/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="167x167" href="img/icons/icon-152x152.png">

    <!-- iPhone X (1125px x 2436px) -->
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" href="img/icons-ios/apple-launch-1125x2436.png">
    <!-- iPhone 8, 7, 6s, 6 (750px x 1334px) -->
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="img/icons-ios/apple-launch-750x1334.png">
    <!-- iPhone 8 Plus, 7 Plus, 6s Plus, 6 Plus (1242px x 2208px) -->
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)" href="img/icons-ios/apple-launch-1242x2208.png">
    <!-- iPhone 5 (640px x 1136px) -->
    <link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" href="img/icons-ios/apple-launch-640x1136.png">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <meta name="apple-mobile-web-app-title" content="Twittor!">

    <!-- Web Vitals -->
    <script type="module">
        import {onCLS, onINP, onLCP} from 'https://unpkg.com/web-vitals@4?module';
        function sendToRUM(metric) {
            console.log(`[RUM/Web Vitals] Metric: ${metric.name} | Value: ${metric.value.toFixed(2)} | Rating: ${metric.rating}`);
            // Simulación de guardar en base de datos local (IndexedDB)
            // Aquí se enviaría el fetch() al backend real, pero lo registramos como RUM
        }
        onCLS(sendToRUM);
        onINP(sendToRUM);
        onLCP(sendToRUM);
    </script>
</head>
<body>
        <!-- Indicador de Permisos -->
        <div id="permission-indicator" style="position: absolute; top: 10px; right: 10px; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 14px; z-index: 1000; background-color: rgba(255,255,255,0.9); color: black; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
            Permisos Push: <span id="permission-status">Default</span>
        </div>
        <!-- Titulo -->
        <span class="first"> 
            <span id="salir-btn" class="fa fa-sign-out-alt out oculto animated fadeIn"></span>
            <!-- Boton Instalacion -->
            <button id="install-btn" class="oculto animated fadeIn" style="background-color: #f1c40f; border: none; padding: 5px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-right: 15px;">
                <i class="fa fa-download"></i> Instalar App
            </button>
            <span id="titulo">
                <i class="fa fa-user"></i>
                Autenticación
            </span>
            <span id="nuevo-btn" class="fa fa-pen-square new oculto animated fadeIn fast"></span>
        </span>
        <!-- Fin Titulo -->

        <!-- Login Form -->
        <div id="login-container" align="center" class="animated fadeIn fast" style="margin-top: 50px;">
            <h2>Iniciar Sesión o Registro</h2>
            <p style="font-size: 14px; color: #555;">Si la cuenta no existe, se creará automáticamente.</p>
            <input type="text" id="login-username" placeholder="Nombre de usuario" style="padding: 10px; margin: 10px; border-radius: 5px; border: 1px solid #ccc; width: 80%; max-width: 300px;"><br>
            <input type="password" id="login-password" placeholder="Contraseña" style="padding: 10px; margin: 10px; border-radius: 5px; border: 1px solid #ccc; width: 80%; max-width: 300px;"><br>
            <button id="login-btn" style="padding: 10px 20px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">Ingresar / Registrarme</button>
            <br><br>
            <p id="login-error" style="color: red; display: none;">Debe ingresar usuario y contraseña</p>
            <p id="login-fail" style="color: red; display: none;">Contraseña incorrecta. Intente nuevamente.</p>
        </div>
        <!-- Fin Login Form -->

        <!-- Modal -->
        <div id="modal" class="oculto">
            <img id="modal-avatar" src="img/avatars/spiderman.jpg">

            <span class="first"> 
                <span id="titulo-modal">Nuevo mensaje</span>
                <span id="cancel-btn" class="fa fa-times"></span>
            </span>
            

            <div class="nuevo-mensaje">
                <textarea id="txtMensaje" placeholder="Nuevo mensaje..." rows="5"></textarea>
            </div>

            
            <!-- boton de enviar -->

            <div id="post-btn" class="fab">
                <i class="fa fa-paper-plane"></i>
            </div>

            <div id="post-btn" class="fab-marker">
                <i class="fa fa-map-marker-alt"></i>
            </div>

            <div id="post-btn" class="fab-photo">
                <i class="fa fa-image"></i>
            </div>

        </div>
        <!-- Fin Modal -->

        <!-- Seleccion de personaje -->
        <div id="seleccion" class="seleccion oculto" align="center">
        
            <!-- Botón de notificaciones -->
            <button class="oculto btn-noti-activadas">Notificaciones Activadas</button>
            <button class="oculto btn-noti-desactivadas">Notificaciones Desactivadas</button>
            <!-- Fin de boton de notificaciones -->

            <div>
                <img data-user="spiderman" src="img/avatars/spiderman.jpg" alt="spiderman" class="seleccion-avatar">
            </div>

            <div>
                <img data-user="ironman" src="img/avatars/ironman.jpg" alt="ironman" class="seleccion-avatar">
            </div>

            <div>
                <img data-user="wolverine" src="img/avatars/wolverine.jpg" alt="wolverine" class="seleccion-avatar">
            </div>

            <div>
                <img data-user="thor" src="img/avatars/thor.jpg" alt="thor" class="seleccion-avatar">
            </div>

            <div>
                <img data-user="hulk" src="img/avatars/hulk.jpg" alt="hulk" class="seleccion-avatar">
            </div>

        </div>

        <!-- FIN Seleccion de personaje -->

        <!-- Lista de mensajes -->
        <ul id="timeline" class="timeline oculto">
            
            <!-- Mensaje -->
            <!-- <li class="animated fadeIn fast">
                <div class="avatar">
                    <img src="img/avatars/spiderman.jpg">
                </div>
                <div class="bubble-container">
                    <div class="bubble">
                        <h3>@spiderman</h3>
                        <br/>
                        La tía May, hizo unos panqueques en forma de ironman!
                    </div>
                    
                    <div class="arrow"></div>
                </div>
            </li> -->
            <!-- Fin del mensaje -->

        </ul>
        <!-- Fin Lista de mensajes -->


      
    
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/pouchdb@7.0.0/dist/pouchdb.min.js"></script>
        <script src="js/libs/plugins/mdtoast.min.js"></script>
        <script src="js/app.js"></script>

</body>
</html>
