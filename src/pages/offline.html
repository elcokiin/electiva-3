<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión | Rick &amp; Morty PWA</title>
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        crossorigin="anonymous" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-dark text-white">

  <div class="container text-center py-5">

    <div class="offline-icon mb-4">📡</div>

    <h1 class="display-4 font-weight-bold">Sin conexión</h1>
    <p class="lead text-muted mb-4">
      No pudimos cargar esta página y tampoco está guardada en tu caché.
    </p>
    <p class="text-muted mb-5">
      Revisa tu conexión a internet e inténtalo de nuevo.
    </p>

    <div class="d-flex justify-content-center">
      <a href="../index.html" class="btn btn-primary btn-lg mr-3">
        🏠 Ir al inicio
      </a>
      <button onclick="window.location.reload()" class="btn btn-outline-light btn-lg">
        🔄 Reintentar
      </button>
    </div>

    <hr class="border-secondary my-5" />

    <p class="small text-muted">
      💡 Tip: Visita las páginas mientras tienes conexión para guardarlas en caché.
    </p>

  </div>

</body>
</html>
