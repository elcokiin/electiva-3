<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/list.css">
    <meta name="theme-color" content="#db4938">
    <title>Mis Órdenes - Cafeteria PWA</title>
</head>

<body>
    <main>
        <nav style="position: relative;">
            <h1>Cafeteria PWA</h1>
            <div></div>
            <h2>Mis Órdenes</h2>
            <a class="order-counter" href="list.html">
                ☕ Órdenes: <span id="counter-value">0</span>
            </a>
            <p></p>
        </nav>

        <div class="list-toolbar">
            <a href="Menu.html" class="back-link">← Volver al menú</a>
            <button id="btn-clear" class="btn-clear">🗑️ Limpiar todo</button>
        </div>

        <div id="orders-container" class="orders-wrapper">
            <h2 style="text-align:center;">Cargando órdenes...</h2>
        </div>

        <!-- Modal de confirmación -->
        <div id="modal-overlay" class="modal-overlay" style="display:none;">
            <div class="modal">
                <h3 id="modal-title">Confirmar acción</h3>
                <p id="modal-message"></p>
                <div class="modal-buttons">
                    <button id="modal-confirm" class="btn-confirm">Confirmar</button>
                    <button id="modal-cancel" class="btn-cancel">Cancelar</button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/applist.js"></script>
</body>

</html>
