<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="manifest" href="manifest.json"/>
  <title>Galería PWA</title>
  <style>
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #ffffff; color: #eee; font-family: sans-serif; }
    img  { max-width: 90vw; max-height: 70vh; border: 2px solid #000; }
    p    { margin-top: 12px; font-size: 0.9rem; color: #000000; }
  </style>
</head>
<body>
  <img id="img" src="" alt="imagen"/>
  <p id="estado">Cargando...</p>

  <script>
    const IMAGENES = [
      'resources/imagen1.svg',
      'resources/imagen2.svg',
      'resources/imagen3.svg',
      'resources/imagen4.svg',
    ];
    const FALLBACK = 'fallback.svg';
    const TIMEOUT  = 3000;
    const INTERVALO = 5000;

    let anterior = -1;

    // Elige índice aleatorio distinto al anterior
    function aleatorio() {
      let i;
      do { i = Math.floor(Math.random() * IMAGENES.length); } while (i === anterior);
      return (anterior = i);
    }

    // Promesa que carga una imagen o rechaza si supera el timeout
    function cargarImagen(src) {
      const carga = new Promise((res, rej) => {
        const img = new Image();
        img.onload  = () => res(src);
        img.onerror = () => rej('error');
        img.src = src;
      });
      const timeout = new Promise((_, rej) => setTimeout(() => rej('timeout'), TIMEOUT));
      return Promise.race([carga, timeout]);
    }

    async function siguiente() {
      const src = IMAGENES[aleatorio()];
      document.getElementById('estado').textContent = `Cargando ...`;
      try {
        await cargarImagen(src);
        document.getElementById('img').src = src;
        document.getElementById('estado').textContent = `✔ `;
      } catch (e) {
        document.getElementById('img').src = FALLBACK;
        document.getElementById('estado').textContent = `⚠ Timeout — mostrando fallback`;
      }
    }

    // Registrar Service Worker
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

    siguiente();
    setInterval(siguiente, INTERVALO);
  </script>
</body>
</html>
