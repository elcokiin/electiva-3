<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/style.css">
  <link rel="apple-touch-icon" href="images/icons/icon-72x72.png">
  <link rel="apple-touch-icon" href="images/icons/icon-96x96.png">
  <link rel="apple-touch-icon" href="images/icons/icon-128x128.png">
  <link rel="apple-touch-icon" href="images/icons/icon-144x144.png">
  <link rel="apple-touch-icon" href="images/icons/icon-152x152.png">
  <link rel="apple-touch-icon" href="images/icons/icon-192x192.png">
  <link rel="apple-touch-icon" href="images/icons/icon-384x384.png">
  <link rel="apple-touch-icon" href="images/icons/icon-512x512.png">
  <meta name="apple-mobile-web-app-status-bar" content="#db4938">
  <meta name="theme-color" content="#db4938">
  <title>Cafetería PWA</title>
</head>

<body>
  <main>
    <nav style="position: relative;">
      <h1>Cafeteria PWA</h1>
      <div></div>
      <h2>Haga su pedido!</h2>
      <div class="order-counter">
        ☕ Órdenes: <span id="counter-value">0</span>
      </div>
      <p></p>
    </nav>
    <section class="panel panel--wide">
      <div class="panel__header">
        <h2>Listado de productos</h2>
        <div class="approval-actions">
          <button type="button" id="products-confirm" class="btn-approve">Confirmar</button>
          <button type="button" id="products-reject" class="btn-reject">Rechazar</button>
        </div>
      </div>
      <p id="products-status" class="status status--pending">Operacion pendiente de confirmacion.</p>
    </section>
    <div class="container"></div>
  </main>
  <script src="js/app.js"></script>
</body>

</html>
