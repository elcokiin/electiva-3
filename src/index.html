<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>PWA Personajes | Rick &amp; Morty</title>
  <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        crossorigin="anonymous" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-dark bg-dark">
    <span class="navbar-brand mb-0 h1">
      <img src="./img/logo.png" alt="Logo" width="32" height="32" class="mr-2" />
      Rick &amp; Morty PWA
    </span>
    <span id="status-badge" class="badge badge-success">Online</span>
  </nav>

  <!-- MAIN -->
  <div class="container mt-4">

    <!-- Indicador de estado de red -->
    <div id="offline-banner" class="alert alert-warning d-none" role="alert">
      ⚠️ Estás sin conexión. Mostrando datos guardados en caché.
    </div>

    <!-- Botones de navegación -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">Personajes</h2>
      <div>
        <button id="btn-leer-despues" class="btn btn-outline-warning btn-sm mr-2"
                onclick="window.location.href='./pages/leer-despues.html'">
          📚 Leer después
        </button>
        <button id="btn-cargar" class="btn btn-primary btn-sm" onclick="cargarPersonajes()">
          🔄 Actualizar
        </button>
      </div>
    </div>

    <!-- Spinner de carga -->
    <div id="spinner" class="text-center py-5 d-none">
      <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Cargando...</span>
      </div>
      <p class="mt-2 text-muted">Cargando personajes...</p>
    </div>

    <!-- Grid de personajes -->
    <div id="personajes-grid" class="row"></div>

    <!-- Paginación -->
    <div class="d-flex justify-content-center mt-4 mb-5">
      <button id="btn-prev" class="btn btn-outline-secondary mr-2" onclick="cambiarPagina(-1)">
        ← Anterior
      </button>
      <span id="pagina-info" class="btn btn-light disabled">Página 1</span>
      <button id="btn-next" class="btn btn-outline-secondary ml-2" onclick="cambiarPagina(1)">
        Siguiente →
      </button>
    </div>

  </div>

  <!-- MODAL detalle personaje -->
  <div class="modal fade" id="modalPersonaje" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-nombre"></h5>
          <button type="button" class="close" data-dismiss="modal">
            <span>&times;</span>
          </button>
        </div>
        <div class="modal-body text-center">
          <img id="modal-img" src="" alt="" class="img-fluid rounded mb-3"
               style="max-height:220px;" />
          <table class="table table-sm table-bordered text-left">
            <tbody id="modal-detalle"></tbody>
          </table>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-warning" id="btn-guardar-despues">
            📚 Guardar para leer después
          </button>
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
          crossorigin="anonymous"></script>
  <script src="./js/app.js"></script>
  <script src="./js/personajes.js"></script>
</body>
</html>
