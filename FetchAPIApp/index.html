<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FetchAPIApp</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f0f0f0; }
    a { color: blue; cursor: pointer; text-decoration: underline; }
    #detalle { margin-top: 30px; display: none; }
    #detalle h2 { margin-bottom: 10px; }
    .campo { margin-bottom: 8px; }
    label { font-weight: bold; display: inline-block; width: 150px; }
    input[type="text"] { width: 250px; padding: 4px; }
    button { margin-top: 10px; padding: 6px 16px; cursor: pointer; }
  </style>
</head>
<body>

<h1>Listado de Usuarios</h1>
<table id="tabla">
  <thead>
    <tr>
      <th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Compañía</th><th>Website</th>
    </tr>
  </thead>
  <tbody id="cuerpo"></tbody>
</table>

<div id="detalle">
  <h2>Detalle del Usuario</h2>
  <div class="campo"><label>ID:</label><span id="d-id"></span></div>
  <div class="campo"><label>Nombre:</label><input type="text" id="d-name"></div>
  <div class="campo"><label>Usuario:</label><input type="text" id="d-username"></div>
  <div class="campo"><label>Correo:</label><input type="text" id="d-email"></div>
  <div class="campo"><label>Teléfono:</label><input type="text" id="d-phone"></div>
  <div class="campo"><label>Website:</label><input type="text" id="d-website"></div>
  <div class="campo"><label>Compañía:</label><input type="text" id="d-company"></div>
  <div class="campo"><label>Ciudad:</label><input type="text" id="d-city"></div>
  <div class="campo"><label>Calle:</label><input type="text" id="d-street"></div>
  <div class="campo"><label>Código Postal:</label><input type="text" id="d-zip"></div>
  <button onclick="guardarCambios()">Guardar Cambios</button>
</div>

<script>
  let usuarios = [];

  fetch('https://jsonplaceholder.typicode.com/users')
    .then(res => res.json())
    .then(data => {
      usuarios = data.slice(0, 30);
      const cuerpo = document.getElementById('cuerpo');
      usuarios.forEach(u => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><a onclick="verDetalle(${u.id})">${u.name}</a></td>
          <td>${u.email}</td>
          <td>${u.phone}</td>
          <td>${u.company.name}</td>
          <td>${u.website}</td>
        `;
        cuerpo.appendChild(tr);
      });
    });

  function verDetalle(id) {
    const u = usuarios.find(x => x.id === id);
    document.getElementById('d-id').textContent = u.id;
    document.getElementById('d-name').value = u.name;
    document.getElementById('d-username').value = u.username;
    document.getElementById('d-email').value = u.email;
    document.getElementById('d-phone').value = u.phone;
    document.getElementById('d-website').value = u.website;
    document.getElementById('d-company').value = u.company.name;
    document.getElementById('d-city').value = u.address.city;
    document.getElementById('d-street').value = u.address.street;
    document.getElementById('d-zip').value = u.address.zipcode;
    document.getElementById('detalle').style.display = 'block';
    document.getElementById('detalle').scrollIntoView({ behavior: 'smooth' });
  }

  function guardarCambios() {
    const id = parseInt(document.getElementById('d-id').textContent);
    const u = usuarios.find(x => x.id === id);
    u.name = document.getElementById('d-name').value;
    u.username = document.getElementById('d-username').value;
    u.email = document.getElementById('d-email').value;
    u.phone = document.getElementById('d-phone').value;
    u.website = document.getElementById('d-website').value;
    u.company.name = document.getElementById('d-company').value;
    u.address.city = document.getElementById('d-city').value;
    u.address.street = document.getElementById('d-street').value;
    u.address.zipcode = document.getElementById('d-zip').value;

    console.log('Usuario actualizado:', u);
    alert('Cambios guardados. Revisa la consola.');
  }
</script>

</body>
</html>
