<h2>Lista de Pokémon</h2>

@if (pokemones$ | async; as data) {
  <p class="text-muted">Total: {{ data.count }} Pokémon</p>

  <table class="table table-striped table-hover">
    <thead class="table-danger">
      <tr>
        <th>#</th>
        <th>Nombre</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (p of data.results; track p.name) {
        <tr>
          <td>{{ getId(p.url) }}</td>
          <td class="text-capitalize">{{ p.name }}</td>
          <td>
            <a [routerLink]="['/pokemon', getId(p.url)]"
               class="btn btn-sm btn-outline-danger">
              Ver detalle
            </a>
          </td>
        </tr>
      }
    </tbody>
  </table>

  <div class="d-flex gap-2">
    <button class="btn btn-secondary"
            (click)="anterior()"
            [disabled]="offset === 0">
      ← Anterior
    </button>
    <button class="btn btn-danger"
            (click)="siguiente()"
            [disabled]="!data.next">
      Siguiente →
    </button>
  </div>

} @else {
  <!-- Mientras carga -->
  <div class="text-center my-5">
    <div class="spinner-border text-danger"></div>
    <p class="mt-2">Cargando Pokémon...</p>
  </div>
}
